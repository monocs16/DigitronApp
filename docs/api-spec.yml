# Digitron — server-function contracts
#
# These are TanStack Start server functions (RPC-style, not REST). Every function
# runs behind `requireSupabaseAuth` (Bearer JWT). Order functions use the
# authenticated `context.supabase` client under RLS. User-management functions
# create a service-role client only after verifying the caller is `super`.
#
# On failure a function throws `Error(message)`, serialized by TanStack as a
# non-2xx response. Input is validated with Zod before the handler runs.
#
# Grow this file per feature.

version: 2

serverFunctions:
  # ---- src/lib/users.functions.ts (super only) ----
  listUsers:
    file: src/lib/users.functions.ts
    method: GET
    auth: super
    databaseClient: service role after super verification
    input: {}
    returns: "Array<{ id, full_name, role: AppRole|null, created_at, email }>"
  createUser:
    file: src/lib/users.functions.ts
    method: POST
    auth: super
    databaseClient: service role after super verification
    input:
      email: string(email)
      password: string(6..128)
      full_name: string
      role: AppRole
    returns: "{ id: string }"
  updateUserRole:
    file: src/lib/users.functions.ts
    method: POST
    auth: super
    databaseClient: service role after super verification
    input: { user_id: uuid, role: AppRole }
    returns: "{ ok: true }"
    errors: ["You cannot remove your own super role."]
  deleteUser:
    file: src/lib/users.functions.ts
    method: POST
    auth: super
    databaseClient: service role after super verification
    input: { user_id: uuid }
    returns: "{ ok: true }"
    errors: ["You cannot delete yourself."]

  # ---- src/lib/orders.functions.ts ----
  transitionOrder:
    file: src/lib/orders.functions.ts
    method: POST
    auth: authenticated (state-machine enforces role/assignment/gates)
    input:
      order_id: uuid
      target_stage: OrderStage
    behavior: >
      Applies only an adjacent edge from STAGE_TRANSITIONS. Entering repair requires
      an approved budget; payment→awaiting_withdrawal requires the persisted balance
      to be settled or waived; non-super technicians must own the assignment.
    returns: "{ ok: true }"
    errors: ["Order not found.", "Transition not allowed."]
  revertOrderStage:
    file: src/lib/orders.functions.ts
    method: POST
    auth: >
      administrativo | super for configured previous edges; assigned tecnico only
      for budget→evaluation and payment→repair corrections
    input:
      order_id: uuid
      target_stage: OrderStage
      reason: string(3..1000)
    behavior: "Appends the correction reason to order_notes, then applies the allowed previous stage."
    returns: "{ ok: true }"
    errors: ["The requested correction is not allowed."]
  createWarrantyOrder:
    file: src/lib/orders.functions.ts
    method: POST
    auth: administrativo | super (origin must be closed)
    input: { origin_order_id: uuid }
    behavior: >
      Creates a new order in evaluation with the original customer, equipment and
      reported fault, linked through warranty_origin_id.
    returns: "{ id: string }"
    errors:
      - "Only administrativo or super can create warranty orders."
      - "Order not found."
      - "Only closed orders can open a warranty order."
  recordBudgetDecision:
    file: src/lib/orders.functions.ts
    method: POST
    auth: administrativo | super
    input:
      order_id: uuid
      decision: "approved | deferred | rejected"
      "deferred_reason?": string(<=500)
    behavior: >
      Sets budgets.decision/decided_at/deferred_reason; sets orders.authorized=true on approved;
      appends a human-readable note for a deferred reason; auto-advances the stage
      (approved→repair, deferred→on_hold, rejected→awaiting_withdrawal) via the state machine.
    returns: "{ ok: true, stage: OrderStage }"
    errors:
      - "Only administrativo or super can record the customer decision."
      - "A deferred decision requires a reason."
      - "Create the budget first."
      - "Transition not allowed."
  notifyCustomer:
    file: src/lib/orders.functions.ts
    method: POST
    auth: administrativo | super
    input:
      order_id: uuid
      kind: "decision | delivery"
    behavior: "Stamps decision_notified_at or delivery_notified_at. Email delivery is deferred (TODO)."
    returns: "{ ok: true }"
    errors: ["Only administrativo or super can notify the customer."]
  deliverOrder:
    file: src/lib/orders.functions.ts
    method: POST
    auth: administrativo | super (origin stage must be awaiting_withdrawal)
    input:
      order_id: uuid
      received_by: string(1..200)
      "closing_notes?": string(<=2000)
    behavior: "Sets received_by, delivery_at and optional closing_notes; advances directly to closed."
    returns: "{ ok: true }"
    errors: ["Order not found.", "Transition not allowed."]
