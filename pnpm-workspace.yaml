allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - brace-expansion@1.1.18
  - brace-expansion@5.0.9
  - dompurify@3.4.13
  - js-yaml@4.3.1
  - nanoid@3.3.17
  - postcss@8.5.18
  - undici@7.29.0
overrides:
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=3.0.0 <5.0.9: ^5.0.9
  dompurify@<=3.4.12: ^3.4.13
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.17: ^3.3.17
  postcss@<8.5.18: ^8.5.18
  sharp@<0.35.0: 0.35.3
  undici@>=7.0.0 <7.29.0: ^7.29.0
# ESLint still depends on minimatch@3, whose CommonJS integration requires the
# callable brace-expansion@1 API. brace-expansion@5 exports { expand } instead,
# so forcing the patched major onto that dev-only path breaks lint.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
