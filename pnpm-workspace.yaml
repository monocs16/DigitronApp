allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - brace-expansion@1.1.16
  - brace-expansion@5.0.8
  - js-yaml@4.3.0
  - postcss@8.5.18
overrides:
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@>=3.0.0 <5.0.8: ^5.0.8
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  postcss@<8.5.18: ^8.5.18
  sharp@<0.35.0: 0.35.3
# ESLint still depends on minimatch@3, whose CommonJS integration requires the
# callable brace-expansion@1 API. brace-expansion@5 exports { expand } instead,
# so forcing the patched major onto that dev-only path breaks lint.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
